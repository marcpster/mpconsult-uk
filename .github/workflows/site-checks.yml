name: Site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Mobile & page checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run checks (phone, tablet, desktop)
        run: npx playwright test

      - name: Upload report with screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-checks-report
          path: playwright-report/
          retention-days: 14
