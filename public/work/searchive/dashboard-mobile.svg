<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="360" height="600" role="img" aria-label="Placeholder for the SearcHive CRM dashboard on mobile, showing the LeadDelta sync health card with a green healthy status and the Job Changes KPI tile beneath it">
  <!-- Page background -->
  <rect width="360" height="600" fill="#fafafa"/>

  <!-- Phone outline with dashed placeholder border -->
  <rect x="40" y="20" width="280" height="560" rx="32" fill="#ffffff" stroke="#a3a3a3" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Notch hint -->
  <rect x="148" y="36" width="64" height="6" rx="3" fill="#d4d4d4"/>

  <!-- Card 1: LeadDelta sync health card -->
  <rect x="64" y="80" width="232" height="116" rx="14" fill="#f5f5f5" stroke="#e5e5e5"/>
  <circle cx="84" cy="108" r="6" fill="#10b981"/>
  <rect x="100" y="102" width="120" height="10" rx="3" fill="#d4d4d4"/>
  <rect x="84" y="138" width="170" height="8" rx="3" fill="#e5e5e5"/>
  <rect x="84" y="156" width="140" height="8" rx="3" fill="#e5e5e5"/>
  <rect x="84" y="174" width="100" height="8" rx="3" fill="#e5e5e5"/>

  <!-- Card 2: Job Changes KPI tile -->
  <rect x="64" y="220" width="232" height="100" rx="14" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="84" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#737373">—</text>
  <rect x="84" y="280" width="160" height="8" rx="3" fill="#d4d4d4"/>
  <rect x="84" y="296" width="110" height="6" rx="3" fill="#e5e5e5"/>

  <!-- Placeholder label inside the phone, below the cards -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="180" y="420" font-size="14" font-weight="600" fill="#525252">Placeholder</text>
    <text x="180" y="442" font-size="12" fill="#737373">Dashboard mobile crop</text>
    <text x="180" y="464" font-size="11" fill="#a3a3a3">Sync health card + Job Changes KPI</text>
  </g>

  <!-- Home indicator -->
  <rect x="140" y="556" width="80" height="4" rx="2" fill="#d4d4d4"/>
</svg>
