<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Profile Banner Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Halved for Retina - captures at 2x to produce 1584x396.
       This is the LinkedIn personal profile banner (background photo). */
    .banner {
      width: 792px;
      height: 198px;
      background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle accent stripe along the top */
    .banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #f86a4d, #e54d2e);
    }

    /* SAFE ZONE
       LinkedIn overlaps the round profile photo over the bottom-left of the
       banner, and crops the sides on mobile. Keep all text inside a centred
       band, clear of the bottom-left corner. The content block below is
       centred for exactly this reason. Do not move text to the edges. */
    .content {
      text-align: center;
      padding: 0 120px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #171717;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 13px;
      color: #525252;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .domain {
      font-size: 12px;
      font-weight: 500;
      color: #e54d2e;
    }

    /* Dark version - uncomment to use */
    /*
    .banner {
      background: linear-gradient(135deg, #0a0a0a 0%, #171717 100%);
    }
    h1 { color: #fafafa; }
    .tagline { color: #a3a3a3; }
    */
  </style>
</head>
<body>
  <div class="banner">
    <div class="content">
      <h1>Get up and running with AI and automation.</h1>
      <p class="tagline">Built with you, handed over, yours to run.</p>
      <p class="domain">mpconsult.uk</p>
    </div>
  </div>
</body>
</html>
