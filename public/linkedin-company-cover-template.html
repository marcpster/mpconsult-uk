<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Company Cover Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Halved for Retina - captures at 2x to produce 1128x192.
       This is the LinkedIn company Page cover image. The height is kept to a
       whole, even number so flex-centred text lands on whole device pixels
       and stays crisp. 192 is 1px over LinkedIn's 1128x191; that is harmless. */
    .cover {
      width: 564px;
      height: 96px;
      background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle accent stripe along the top */
    .cover::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f86a4d, #e54d2e);
    }

    /* SAFE ZONE
       LinkedIn overlaps the company logo over the lower-left of the cover.
       Keep text centred and clear of the left edge. The cover is short, so
       keep to two short lines plus the domain. */
    .content {
      text-align: center;
      padding: 0 60px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #171717;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .domain {
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #e54d2e;
    }

    /* Dark version - uncomment to use */
    /*
    .cover {
      background: linear-gradient(135deg, #0a0a0a 0%, #171717 100%);
    }
    h1 { color: #fafafa; }
    */
  </style>
</head>
<body>
  <div class="cover">
    <div class="content">
      <h1>Get up and running<br>with AI and automation.</h1>
      <p class="domain">mpconsult.uk</p>
    </div>
  </div>
</body>
</html>
