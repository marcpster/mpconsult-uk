<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Personal Profile Cover Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Halved for Retina - captures at 2x to produce 1584x396.
       This is the LinkedIn personal profile background banner (1584x396).
       Both dimensions are even, so the 2x capture and flex centring land on
       whole device pixels and stay crisp. */
    .cover {
      width: 792px;
      height: 198px;
      background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    /* Subtle accent stripe along the top */
    .cover::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #f86a4d, #e54d2e);
    }

    /* SAFE ZONE
       The profile photo overlaps the LOWER-LEFT of the banner - a large
       circle anchored near the bottom-left edge. LinkedIn also crops the
       banner inwards on mobile. So: keep the content vertically centred and
       pushed in from the left so it clears the photo and survives the crop. */
    .content {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-left: 150px;
    }

    /* MP monogram - the brand mark, echoing the rounded-square logo style */
    .mark {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #f86a4d, #e54d2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(229, 77, 46, 0.28);
    }

    .text {
      line-height: 1.25;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      color: #171717;
      letter-spacing: -0.025em;
      margin-bottom: 5px;
    }

    h1 .light {
      font-weight: 400;
      color: #525252;
    }

    .tagline {
      font-size: 14px;
      font-weight: 500;
      color: #525252;
      margin-bottom: 7px;
    }

    .domain {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #e54d2e;
    }

    /* Dark version - uncomment to use */
    /*
    .cover {
      background: linear-gradient(135deg, #0a0a0a 0%, #171717 100%);
    }
    h1 { color: #fafafa; }
    h1 .light { color: #a3a3a3; }
    .tagline { color: #a3a3a3; }
    */
  </style>
</head>
<body>
  <div class="cover">
    <div class="content">
      <div class="mark">MP</div>
      <div class="text">
        <h1>MP Consult</h1>
        <p class="tagline">Tech that quietly works for small businesses</p>
        <p class="domain">mpconsult.uk</p>
      </div>
    </div>
  </div>
</body>
</html>
